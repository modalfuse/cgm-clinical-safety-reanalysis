[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgm-clinical-safety-reanalysis"
version = "1.0.0"
description = "Audit-focused CGM clinical-safety metrics and aggregate result reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
